/* ══════════════════════════════════════════════
   ROUTER — hash-based navigation
   URLs: #home | #privacy | #blog | #blog/0 etc.
══════════════════════════════════════════════ */

function showPage(id) {
  window.location.hash = id;
}

function scrollToBlog() {
  window.location.hash = 'blog';
}

function navigate() {
  const hash = window.location.hash.replace('#', '') || 'home';

  // Hide all pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  if (hash.startsWith('blog/')) {
    // Individual blog post page
    const index = parseInt(hash.split('/')[1]);
    renderPostPage(index);
    document.getElementById('page-post').classList.add('active');

  } else if (hash === 'blog') {
    document.getElementById('page-home').classList.add('active');
    setTimeout(() => document.getElementById('blog').scrollIntoView({ behavior: 'smooth' }), 50);

  } else if (hash === 'privacy') {
    document.getElementById('page-privacy').classList.add('active');
    window.scrollTo({ top: 0 });

  } else {
    document.getElementById('page-home').classList.add('active');
    window.scrollTo({ top: 0 });
  }
}

// Listen to back/forward button
window.addEventListener('hashchange', navigate);
// Run on first load
window.addEventListener('load', navigate);

/* ══════════════════════════════════════════════
   RENDER BLOG GRID (cards on home page)
   Shows first 6 posts with "Read more" linking
   to their own page via hash
══════════════════════════════════════════════ */

function renderBlog() {
  const grid = document.getElementById('blog-grid');
  if (!grid) return;
  grid.innerHTML = '';

  // Show only first 6 as preview cards
  POSTS.slice(0, 6).forEach((post, i) => {
    const card = document.createElement('article');
    card.className = 'post-card';
    card.style.cursor = 'pointer';
    card.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span class="post-tag">${post.tag}</span>
        <span class="post-date">${post.date}</span>
      </div>
      <div class="post-title">${post.title}</div>
      <div class="post-excerpt">${post.excerpt}</div>
      <span class="read-more">Read full article →</span>
    `;
    card.addEventListener('click', () => {
      window.location.hash = 'blog/' + i;
    });
    grid.appendChild(card);
  });

  // "View all" link if more than 6 posts
  if (POSTS.length > 6) {
    const viewAll = document.createElement('div');
    viewAll.style.cssText = 'grid-column:1/-1; text-align:center; padding-top:8px;';
    viewAll.innerHTML = `<button onclick="showAllPosts()" style="font-size:13px; font-weight:500; color:var(--accent); background:transparent; border:0.5px solid var(--accent); padding:8px 20px; border-radius:999px; cursor:pointer; font-family:var(--ff-body);">View all ${POSTS.length} articles →</button>`;
    grid.appendChild(viewAll);
  }
}

/* ══════════════════════════════════════════════
   RENDER INDIVIDUAL BLOG POST PAGE
══════════════════════════════════════════════ */

function renderPostPage(index) {
  const post = POSTS[index];
  if (!post) { window.location.hash = 'home'; return; }

  const container = document.getElementById('post-content');
  const prev = index > 0 ? POSTS[index - 1] : null;
  const next = index < POSTS.length - 1 ? POSTS[index + 1] : null;

  container.innerHTML = `
    <div style="max-width:680px; margin:0 auto; padding:3rem 2rem 5rem;">

      <!-- Back link -->
      <a onclick="history.back()" style="display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-secondary); cursor:pointer; margin-bottom:2.5rem; text-decoration:none;">
        ← Back
      </a>

      <!-- Tag + Date -->
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:1.25rem;">
        <span class="post-tag">${post.tag}</span>
        <span style="font-size:12px; color:var(--text-tertiary);">${post.date}</span>
      </div>

      <!-- Title -->
      <h1 style="font-family:var(--ff-display); font-size:clamp(28px, 5vw, 42px); font-weight:400; line-height:1.15; letter-spacing:-0.02em; color:var(--text-primary); margin-bottom:2rem;">${post.title}</h1>

      <!-- Divider -->
      <div style="height:0.5px; background:var(--border); margin-bottom:2rem;"></div>

      <!-- Body -->
      <div class="post-full-body">${post.body}</div>

      <!-- Divider -->
      <div style="height:0.5px; background:var(--border); margin:3rem 0 2rem;"></div>

      <!-- Prev / Next navigation -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        ${prev ? `
        <div onclick="window.location.hash='blog/${index-1}'" style="padding:1rem 1.25rem; border:0.5px solid var(--border); border-radius:var(--radius-md); cursor:pointer; background:var(--bg-card); transition:background 0.15s;" onmouseenter="this.style.background='var(--bg-surface)'" onmouseleave="this.style.background='var(--bg-card)'">
          <div style="font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:6px;">← Previous</div>
          <div style="font-size:13px; font-weight:500; color:var(--text-primary); line-height:1.4;">${prev.title}</div>
        </div>` : '<div></div>'}
        ${next ? `
        <div onclick="window.location.hash='blog/${index+1}'" style="padding:1rem 1.25rem; border:0.5px solid var(--border); border-radius:var(--radius-md); cursor:pointer; background:var(--bg-card); text-align:right; transition:background 0.15s;" onmouseenter="this.style.background='var(--bg-surface)'" onmouseleave="this.style.background='var(--bg-card)'">
          <div style="font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:6px;">Next →</div>
          <div style="font-size:13px; font-weight:500; color:var(--text-primary); line-height:1.4;">${next.title}</div>
        </div>` : '<div></div>'}
      </div>

    </div>
  `;
  window.scrollTo({ top: 0 });
}

function showAllPosts() {
  // Show all posts in the grid
  const grid = document.getElementById('blog-grid');
  grid.innerHTML = '';
  POSTS.forEach((post, i) => {
    const card = document.createElement('article');
    card.className = 'post-card';
    card.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span class="post-tag">${post.tag}</span>
        <span class="post-date">${post.date}</span>
      </div>
      <div class="post-title">${post.title}</div>
      <div class="post-excerpt">${post.excerpt}</div>
      <span class="read-more">Read full article →</span>
    `;
    card.addEventListener('click', () => { window.location.hash = 'blog/' + i; });
    grid.appendChild(card);
  });
}

function togglePrivacy(hdr) {
  const body = hdr.nextElementSibling;
  const isOpen = hdr.classList.contains('open');
  document.querySelectorAll('.privacy-block-hdr').forEach(h => h.classList.remove('open'));
  document.querySelectorAll('.privacy-block-body').forEach(b => b.classList.remove('visible'));
  if (!isOpen) { hdr.classList.add('open'); body.classList.add('visible'); }
}

function initTabs() {
  const wrap = document.getElementById('tabs-wrap');
  INDUSTRIES.forEach((ind, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.innerHTML = `<span class="tab-dot" style="background:${ind.color};opacity:1;"></span>${ind.label}`;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildPanel(ind);
    });
    wrap.appendChild(btn);
  });
  buildPanel(INDUSTRIES[0]);
}

initTabs();
renderBlog();
